name: reconcile_missing_deploys
description: "Re-dispatch recent deployments that never completed"
model: |
  SELECT
    expected.id,
    expected.env,
    expected.version
  FROM `your_project.operations.approved_deployments` AS expected
  LEFT JOIN `your_project.operations.completed_deployments` AS completed
    ON completed.deployment_id = expected.id
  WHERE completed.deployment_id IS NULL
    AND expected.approved_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 7 DAY)
destination:
  type: github_actions
  owner: myorg
  repo: myapp
  workflow_id: deploy.yml
  ref: main
  inputs_template: |
    {
      "deployment_id": "{{ row.id }}",
      "environment": "{{ row.env }}",
      "version": "{{ row.version }}",
      "triggered_by": "drt-reconciliation"
    }
  auth:
    type: bearer
    token_env: GITHUB_TOKEN
sync:
  mode: full
  batch_size: 1
  rate_limit:
    requests_per_second: 2
  on_error: fail
